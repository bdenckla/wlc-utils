# Ruff configuration for wlc-utils.
#
# Wired into the repo-maintenance script's lint step (py/main_repo_maintenance.py) and
# runnable directly from the repo root:
#
#     .venv/Scripts/python.exe -m ruff check py
#     .venv/Scripts/python.exe -m ruff check py --fix
#
# The lint rule set is Ruff's default (pyflakes `F` + pycodestyle `E4`/`E7`/`E9`):
# unused imports and locals, undefined names, f-strings without placeholders, and the
# like.  Line length (E501) is deliberately NOT enforced -- prose-heavy generator
# modules wrap by hand near this width, not by rule.  `line-length` below only takes
# effect if you ever run `ruff format`.

line-length = 100
target-version = "py311"
